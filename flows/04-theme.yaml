appId: com.notx
name: 04 · Tema seçimi (qaranlıq)
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(?s).*Azərbaycanca.*"
    timeout: 30000
- tapOn: "(?s).*Azərbaycanca.*"
- tapOn: "(?s).*Davam et.*"
- tapOn: "(?s).*Parametrlər.*"
# Tema sətri Parametrlər-də (#82)
- tapOn: "(?s).*Tema.*"
- assertVisible: "(?s).*Sistem.*"
- assertVisible: "(?s).*İşıqlı.*"
- tapOn: "(?s).*Qaranlıq.*"
# Seçim dərhal tətbiq olunur və sətirdə göstərilir
- assertVisible: "(?s).*Tema\nQaranlıq.*"
- takeScreenshot: 04-theme-dark
# Restart: seçim qalmalıdır
- launchApp:
    clearState: false
- tapOn: "(?s).*Parametrlər.*"
- assertVisible: "(?s).*Tema\nQaranlıq.*"
