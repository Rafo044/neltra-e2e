---
- launchApp:
    clearState: true
# Soyuq start: ilk kadr bir neçə saniyə gecikə bilər.
- extendedWaitUntil:
    visible: "Dilini seç"
    timeout: 30000
# Flutter kartı bütün mətnləri bir accessibility node-unda birləşdirir
# ("AZ\nAzərbaycanca\nAZ arayüz · AZ transkript") → sətir keçidi üçün (?s).
- tapOn: "(?s).*Azərbaycanca.*"
- tapOn: "(?s).*Davam et.*"
# Ana ekran: boş kitabxana + qeyd CTA. Dil kontrolları artıq burada deyil (#83).
- assertVisible: "(?s).*İlk qeydini yarat.*"
- assertVisible: "(?s).*Qeydə başla.*"
- assertVisible: "(?s).*Bu ay .*qalıb.*"
- assertNotVisible: "(?s).*Dil AZ.*"
- takeScreenshot: 01-home
