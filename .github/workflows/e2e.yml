name: E2E · Maestro

# Yalnız əl ilə işə salınır: APK əvvəlcədən release asset kimi yüklənməlidir.
on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: 'app-release.apk olan release tag (boş = ən son release)'
        required: false
        default: ''

jobs:
  maestro-android:
    name: Maestro (Android 14 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runner diski ~14 GB-dır; emulator system image üçün yer açılır.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/haskell"
          sudo apt-get clean
          df -h / | tail -1

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.apk_tag }}
        run: |
          mkdir -p dist
          if [ -z "$TAG" ]; then
            gh release download --repo "$GITHUB_REPOSITORY" \
              --pattern app-release.apk --dir dist --clobber
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern app-release.apk --dir dist --clobber
          fi
          ls -lh dist
          sha256sum dist/app-release.apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none
          script: |
            adb install -r "$GITHUB_WORKSPACE/dist/app-release.apk"
            maestro test "$GITHUB_WORKSPACE/flows"

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: /home/runner/.maestro/tests
          retention-days: 14
          if-no-files-found: ignore
